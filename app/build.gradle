plugins {
    id 'com.android.application'
}

def ksProps = new Properties()
def ksPropsFile = rootProject.file('keystore.properties')
if (ksPropsFile.exists()) ksProps.load(new FileInputStream(ksPropsFile))

android {
    namespace 'com.ioskeyboard.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ioskeyboard.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    signingConfigs {
        release {
            if (ksPropsFile.exists()) {
                storeFile rootProject.file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksPropsFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
